# Surekli entegrasyon ve yayin.
#
# Iki is tek dosyada: `dogrula` her PR'da ve main'e her push'ta kosar,
# `yayinla` yalnizca main'e push'ta ve `dogrula`yi bekler.
#
# Neden ayri iki workflow dosyasi degil: iki dosya da `on: push` ile ayni anda
# baslar ve yayin, testlerin yesil oldugunu bilemezdi. `needs:` bagini kurmanin
# tek yolu ayni dosyada durmalari.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Ayni dala ust uste push atilirsa onceki kosum iptal edilir. main bunun
# disinda: oradaki her kosum bir yayin adayi, yarida kesilmemeli.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # wrangler hem kurulumda (postinstall > wrangler types) hem yayinda telemetri
  # gonderiyor ve ilk kosumda interaktif soru sorabiliyor. CI'da sessiz kalsin.
  WRANGLER_SEND_METRICS: "false"

jobs:
  dogrula:
    name: tip - lint - test - build
    runs-on: ubuntu-latest

    services:
      # Testler gercek Postgres'e kosar, mock'a degil (CLAUDE.md test kurallari):
      # EXCLUDE kisiti, transaction ve yarisan istek davranisi ancak gercek
      # motorda kanitlanir. Surum yerel konteynerle ve prod Supabase ile ayni: 17.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        # Port yerel konteynerle ayni tutuldu (5455). Boylece asagidaki baglanti
        # dizesi .env.example'daki satirin birebir ayni; iki ortam arasinda
        # gidip gelirken "burada port kacti" sorusu hic dogmuyor.
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # randevu_test veritabanini vitest.global-setup.ts kendisi CREATE ediyor,
      # yani ayrica `npm run db:hazirla` kosturmak gerekmiyor.
      #
      # DATABASE_URL bilerek TANIMSIZ: vitest.setup.ts onu zaten
      # TEST_DATABASE_URL'e esitliyor. Ortamda ikinci bir baglanti dizesi
      # tutmak, "testler hangi veritabanina yaziyor" sorusunu bulandirirdi.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5455/randevu_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Yerelde de 24 kosuyor. Bu bir tercih degil zorunluluk: scripts/*.ts
          # ve vitest.global-setup.ts .ts dosyalarini dogrudan calistiriyor
          # (node'un tip soyma destegi), daha eski bir surumde kosum kirilir.
          node-version: "24"
          cache: npm

      # postinstall `wrangler types` kosturup cloudflare-env.d.ts'i uretiyor.
      # O dosya .gitignore'da oldugu icin depodan gelmiyor; tip kontrolu ondan
      # once kosarsa binding tipleri bulunamaz.
      - name: bagimliliklar
        run: npm ci

      - name: tip kontrolu
        run: npm run tip

      # Degismez 1'i (src/app altinda ham db yok) zorlayan eslint kurali burada
      # kosuyor - lint bu depoda bicim isi degil, izolasyon kapisi.
      - name: lint
        run: npm run lint

      - name: testler
        run: npm test

      # `npm run build` degil `cf:kur`: bu komut once `next build` kosuyor, yani
      # onun kapsadigi her seyi kapsiyor, ustune OpenNext'in worker paketini de
      # uretiyor. Fark onemli - depoda tekrar tekrar "workerd tarafi olculmedi"
      # diye not dusuldu; paketleme hatasi artik yayin aninda degil PR'da cikar.
      #
      # Bu ciktinin kendisi ATILIYOR. Yayin isi kendi build'ini kosuyor, cunku
      # NEXT_PUBLIC_* degiskenleri derleme aninda gomuluyor.
      - name: worker paketi
        run: npm run cf:kur
        env:
          # Degerler SAHTE ve oyle kalmali. Gerekcesi: /giris sayfasi build
          # aninda prerender ediliyor ve supabaseSunucu() cagiriyor; degiskenler
          # yoksa ayarlar() firlatiyor ve build dusuyor (hattin ilk kosumunda
          # olculdu, varsayilmadi).
          #
          # Sahte deger guvenli, cunku hicbir ag cagrisi yapilmiyor: oturum
          # cookie'si olmadan getClaims() token bulamayip hemen donuyor, ustelik
          # `cookies()` cagrisi sayfayi zaten dinamige dusuruyor. Istemci
          # yalnizca KURULUYOR, kullanilmiyor.
          #
          # Bedeli bilinsin: bu adim "degiskenler dogru mu" sorusunu YANITLAMAZ,
          # yalnizca "kod derleniyor ve paketleniyor mu" sorusunu yanitlar.
          # Gercek degerlerin varligini yayin isi kendi adiminda kontrol ediyor.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-sahte.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-sahte-anon-anahtari

  yayinla:
    name: Cloudflare Workers yayini
    needs: dogrula
    # PR'lardan yayin cikmaz; yalnizca main'e dusen commit'ten.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # ONAY KAPISI YOK - merge eden yayinlamis olur.
    #
    # Onceden `environment: uretim` vardi ve o ortamda zorunlu inceleyici
    # tanimliydi; is kuyruga girip "Approve" bekliyordu. Kaldirildi, cunku
    # kapinin dayandigi varsayim yanlisti: "geri alma yeniden derleme demek,
    # yani ucuz degil". Cloudflare her yayinin SURUMUNU sakliyor
    # (`wrangler versions list` ile goruluyor), yani kod geri alinabilir ve
    # yeniden derleme gerektirmiyor:
    #
    #   npx wrangler rollback [surum-id]
    #
    # Ortam bagi bilerek dosyadan KALDIRILDI, ortamin ayarindan degil: kapi
    # gorunmez bir depo ayarinda degil, PR'da incelenen bir dosyada dursun.
    # Ayni gerekceyle hiz sinirlari da WAF kurali degil `wrangler.jsonc`'de
    # (bkz. Faz L). `environment:` satiri geri konursa kapi geri gelir.
    #
    # DIKKAT: bu ucuzluk YALNIZCA KOD icin gecerli. Sema geri alinamiyor -
    # `scripts/prod-goc.ts` tek yon. Bu yuzden goc hala ayri bir is akisi ve
    # geri alma SQL'i PR aciklamasina elle yazilmaya devam ediyor.

    # Iki yayin ust uste binerse Worker'in hangi surumu tasidigi belirsizlesir.
    # Kuyruk sirali ve cancel-in-progress YOK: yarida kesilen bir deploy en kotu
    # sonuc, beklemek ondan iyidir.
    concurrency:
      group: yayin

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"

      # Bunlar secret degil repository VARIABLE olarak duruyor, cunku hepsi
      # tanimi geregi halka acik: anon anahtari ve Turnstile site anahtari
      # tarayiciya gitmek uzere uretildi (bkz. .env.example). Kiraci izolasyonu
      # bu anahtarlara degil sunucudaki scoped-db katmanina dayaniyor.
      #
      # Ama BURADA olmak zorundalar: NEXT_PUBLIC_ onekli her degisken DERLEME
      # aninda gomuluyor. Yalnizca calisma aninda (wrangler vars) tanimlamak
      # gec kalir - tarayiciya bos deger gider.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: bagimliliklar
        run: npm ci

      # Derleme aninda gomulen degiskenler eksikse build sessizce "tanimsiz"
      # gomuyor ve hata canlida, giris ekraninda ortaya cikiyor. Erken ve
      # anlasilir patlamak yegdir.
      - name: derleme degiskenleri var mi
        run: |
          eksik=""
          for ad in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!ad}" ]; then eksik="$eksik $ad"; fi
          done
          if [ -n "$eksik" ]; then
            echo "Eksik repository variable:$eksik"
            echo "Ayarlar > Secrets and variables > Actions > Variables altina ekle."
            exit 1
          fi

      # BOT KAPISININ IKI YAKASI BIRLIKTE ACILIR.
      #
      # Sunucu tarafi (wrangler.jsonc > vars > TURNSTILE_MODU="gercek") jeton
      # istiyor; istemci tarafi jetonu ancak NEXT_PUBLIC_TURNSTILE_SITE_KEY
      # varsa uretebiliyor - anahtar yoksa `turnstile-alani.tsx` widget'i HIC
      # cizmiyor. Ikisi ayrisirsa canlida HER randevu 403 alir.
      #
      # Bu adim o kombinasyonu yayina hic birakmiyor. Faz L oncesinde iki yaka
      # da KAPALIYDI ve simetri sessizce dogruydu; modu acan degisiklik o
      # simetriyi bir dosyaya bagimli hale getirdi, o yuzden burada zorlaniyor.
      - name: turnstile iki yakasi tutarli mi
        run: |
          mod=$(grep -o '"TURNSTILE_MODU"[[:space:]]*:[[:space:]]*"[^"]*"' wrangler.jsonc | grep -o '"[^"]*"$' | tr -d '"')
          if [ "$mod" = "gercek" ] && [ -z "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "TURNSTILE_MODU=gercek ama NEXT_PUBLIC_TURNSTILE_SITE_KEY bos."
            echo "Bu haliyle yayinlanirsa canli sitede her randevu 403 alir."
            echo "Yapilacak: Cloudflare > Turnstile'da widget olustur, site"
            echo "anahtarini repository variable olarak gir, gizli anahtari da"
            echo "'wrangler secret put TURNSTILE_SECRET' ile Worker'a gir."
            exit 1
          fi

      # cf:yayinla = opennextjs-cloudflare build + deploy. Wrangler'in cikti
      # verdigi "Total Upload / gzip" satiri plandaki boyut olcumu: ucretsiz
      # plan sinirinin (3 MiB gzip) her yayinda neresinde oldugumuz burada
      # gorunur.
      - name: derle ve yayinla
        run: npm run cf:yayinla
