# Canli siteyi zamanlanmis olarak yoklar - duman testinin surumsuz hali.
#
# Neden ucuncu parti bir izleme servisi degil: depo public, zamanlanmis
# Actions ucretsiz ve basarisiz kosum zaten bildirim gonderiyor. Bir hesap,
# bir sir, bir panel daha eklemeden ayni sonuc.
#
# DUMAN TESTINDEN FARKI: o yalnizca yayin aninda kosuyor, yani "yayin temizdi
# ama gece 3'te Supabase duraklatildi / Hyperdrive baglanti kaybetti /
# sertifika yenilenmedi" durumlarini goremiyor. Bu is onlari goruyor.
#
# Ikinci adim hata takibinin uyari kanali: sayfalar 200 donerken bir route'un
# arka planda patladigi durumu da kirmiziya ceviriyor (scripts/hata-say.ts).
#
# SAAT CLOUDFLARE'DE (src/lib/zamanlayici.ts). Bu is akisi once yalnizca
# `schedule: */30` ile kosuyordu; 10-13 Eylul 2026'da olculen gercek aralik 2
# ile 5,5 saatti. GitHub zamanlanmis kosumlari "mumkun oldugunda" baslatiyor.
# Simdi Worker'in Cron Trigger'i 30 dakikada bir `workflow_dispatch` ile
# tetikliyor; o tur kosum ertelenip dusurulmuyor. Kontrollerin kendisi ve
# uyari kanali (basarisiz kosumun e-postasi) yine burada: gozcu gozledigi
# Worker'in DISINDA kalsin.
#
# `schedule` YEDEK: Cloudflare tetigi olurse (silindi, jetonun suresi doldu,
# Worker patladi) nabiz tamamen susmasin, ve "zamanlayici canli mi" adimi o
# oldugu anda kirmizi yaksin.
#
# Public depoda 60 gun hareket olmazsa GitHub zamanlanmis is akislarini
# KENDILIGINDEN kapatir. Artik yalnizca yedegi etkiliyor; Cloudflare'in
# tetikledigi kosumlar devam ediyor.
#
# Basarisizlik bildirimi: zamanlanmis kosumda cron satirini EN SON degistiren
# kisiye, tetiklenen kosumda jetonun sahibine gidiyor.

name: Nabiz

on:
  # Cloudflare Cron Trigger (worker-girisi.ts) ve elle tetikleme.
  workflow_dispatch:
  schedule:
    # Yedek. Alti saat: amaci arizayi hizla duyurmak degil, zamanlayicinin
    # oldugunu fark etmek. Dakika 17: GitHub saat basindaki yogunlukta
    # zamanlanmis kosumlari en cok o anda geciktiriyor.
    - cron: "17 */6 * * *"

concurrency:
  group: nabiz
  cancel-in-progress: false

jobs:
  yokla:
    name: canli site yoklamasi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # "zamanlayici canli mi" adimi bu is akisinin kendi kosumlarini okuyor.
      actions: read

    steps:
      # Yalnizca betikler gerekiyor; `npm ci` YOK. Ikisi de bagimliliksiz
      # (node'un kendi fetch'i) ve her kosumda bir dakikalik kurulum bosa gitmesin.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/duman.ts
            scripts/hata-say.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: yokla
        run: node scripts/duman.ts "$SITE"
        env:
          SITE: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      # Site ayakta olabilir ama istekler patliyor olabilir - duman testi
      # yalnizca bes sayfaya bakiyor, bu adim BUTUN sunucu hatalarini sayiyor
      # (src/lib/hata.ts). Duman kirmiziysa da kosuyor: iki sinyal birbirinin
      # yerini tutmuyor ve ariza aninda ikisini birden gormek teshisi kisaltiyor.
      - name: hata sayimi
        if: ${{ !cancelled() }}
        run: node scripts/hata-say.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Yalnizca okuyan ayri jeton (Account Analytics Read) - yayin jetonu
          # degil. Kurulumu docs/yayin.md > Hata takibi.
          CLOUDFLARE_ANALIZ_TOKENI: ${{ secrets.CLOUDFLARE_ANALIZ_TOKENI }}

      # Cloudflare tetigi hic kosmuyorsa hata kapisina da yazamaz; o durumu
      # yakalayan tek sey bu adim. YALNIZCA yedek kosumda: tetiklenen kosumda
      # sorunun cevabi kosumun kendisi.
      #
      # Doksan dakika: tetik 30 dakikada bir, tetigin degisikligi Cloudflare'de
      # 15 dakikaya kadar yayiliyor. Iki kacirilmis tetik ariza, biri degil.
      - name: zamanlayici canli mi
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          son=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nabiz.yml \
            --event workflow_dispatch --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          if [ -z "$son" ]; then
            echo "zamanlayici: hic tetiklenmis kosum yok - Cloudflare Cron Trigger kosmuyor."
            exit 1
          fi
          dakika=$(( ( $(date -u +%s) - $(date -u -d "$son" +%s) ) / 60 ))
          if [ "$dakika" -gt 90 ]; then
            echo "zamanlayici: son tetik $dakika dakika once - Cloudflare Cron Trigger kosmuyor."
            echo "Ayrinti: Cloudflare > Workers & Pages > randevu > Logs, kaynak = \"cron nabiz\"."
            exit 1
          fi
          echo "zamanlayici: son tetik $dakika dakika once."
