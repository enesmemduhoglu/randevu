# PROD veritabani gocu - YALNIZCA elle tetiklenir.
#
# Neden yayin hattinin icinde degil: Drizzle migration'larinin otomatik geri
# alma yolu yok ve hedef canli musteri verisi. Sema degisikligi, kod
# yayinlamaktan farkli bir risk sinifi - kodu geri almak eski surumu yeniden
# deploy etmek, semayi geri almak elle SQL yazmak demek.
#
# Sira boyle: once bu is akisini DALDAN kosturursun, yesil olunca main'e merge
# edersin. Yeni kolonu okuyan kod, kolon yerinde degilken canliya cikmasin.
#
# "Daldan" onemli: merge ANINDA yayin cikiyor (CI'daki onay kapisi kaldirildi),
# yani goc icin merge sonrasini beklemek diye bir pencere artik YOK.

name: Prod gocu

on:
  workflow_dispatch:
    inputs:
      onay:
        description: 'PROD semasini degistirmek icin "uygula" yaz'
        required: true
        default: ""

jobs:
  goc:
    name: Supabase migration
    runs-on: ubuntu-latest

    # ORTAM BAGI YOK - ve bunun sebebi bir CELISKI.
    #
    # Onceden `environment: uretim` vardi. O ortamin deployment branch policy'si
    # yalnizca `main`'e izin veriyor; ama bu dosyanin kendi basligi "once bu is
    # akisini kosturursun, YESIL OLUNCA main'e merge edersin" diyor - yani goc,
    # tanimi geregi henuz main'de OLMAYAN bir dosyayi uygulamak zorunda. Iki
    # kural ayni anda saglanamiyordu.
    #
    # Celiski Faz M'de goruldu: 0004 yalnizca dalda duruyordu ve bu is akisi onu
    # uygulayamadi. L3'te fark edilmemisti, cunku o goc (yanlislikla) merge
    # SONRASI kosulmustu - yani hatanin kendisi celiskiyi gizlemisti.
    #
    # Geriye kalan tek kapi asagidaki yazili onay ve bu YETERLI: kosum kaydinda
    # "bunu isteyerek yaptim" izi birakiyor ve is akisini tetikleyebilmek zaten
    # depoya yazma yetkisi istiyor.

    concurrency:
      group: prod-goc

    steps:
      # scripts/prod-goc.ts zaten --onayla bayragi olmadan calismiyor. Bu adim
      # ayni kapiyi bir adim one aliyor: yanlislikla "Run workflow" tiklandiginda
      # depo klonlanmadan, tek satirlik anlasilir bir hatayla duruyor.
      - name: onay kelimesi
        if: github.event.inputs.onay != 'uygula'
        run: |
          echo "Onay kutusuna tam olarak 'uygula' yazilmali. Girilen deger kabul edilmedi."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: bagimliliklar
        run: npm ci
        env:
          WRANGLER_SEND_METRICS: "false"

      # Betik hangi host'a baglandigini SIFREYI BASMADAN yazdiriyor (degismez 5).
      # Baglanti Supavisor SESSION MODE (5432) uzerinden gider; direct baglanti
      # yalnizca IPv6 cozdugu icin Actions kosucusundan erisilemez.
      - name: migration'lari uygula
        run: npm run db:uygula:prod -- --onayla
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
